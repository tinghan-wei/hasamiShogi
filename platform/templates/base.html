<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hasami Shogi Tournament{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    body            { background: #f5f5f5; }
    .navbar-brand   { font-weight: 700; letter-spacing: .02em; }
    .stat-value     { font-size: 1.6rem; font-weight: 700; line-height: 1.1; }
    .result-win     { color: #198754; font-weight: 600; }
    .result-loss    { color: #dc3545; font-weight: 600; }
    .result-draw    { color: #6c757d; }
    .result-forfeit { color: #ffc107; }
    .rank-gold      { color: #c9a227; font-weight: 700; }
    .rank-silver    { color: #777;    font-weight: 700; }
    .rank-bronze    { color: #a0522d; font-weight: 700; }
    table th        { white-space: nowrap; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">Hasami Shogi</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#nav" aria-controls="nav" aria-expanded="false">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="/">Leaderboard</a></li>
        <li class="nav-item"><a class="nav-link" href="/upload">Submit Player</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container pb-5">
  {% with msgs = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in msgs %}
  <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
    {{ msg }}
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>
  {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
